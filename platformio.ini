; 30021 Digital Instrumentation - standard project
; STM32 Nucleo-F302R8 + mbed application shield, bare metal with the
; Standard Peripheral Library.
;
; Start a new assignment by copying this whole folder, renaming it, and
; replacing src/main.c. See README.md.

; Bare metal: no `framework` is set, so the startup code, system_stm32f30x.c
; and the linker script all come from this project (src/vendor/, ldscript/).

[env:nucleo_f302r8]
platform = ststm32
board = nucleo_f302r8
board_build.ldscript = $PROJECT_DIR/ldscript/STM32F302R8TX_FLASH.ld

; printf goes out over USART2, which the on-board ST-Link exposes as a
; virtual COM port. Keep in sync with the uart_init() call in main.c.
monitor_speed = 9600

; PlatformIO compiles every .c under src/ recursively, so old versions parked
; in src/Archive/ would be built too (several main(), duplicate interrupt
; handlers). This builds src/ but skips that folder.
build_src_filter =
    +<*>
    -<Archive/>

; The drivers in lib/ define interrupt handlers (SysTick, TIM6, EXTI, USART2)
; and _write_r(). By default PlatformIO packs each library into a static
; archive, and the linker only takes an object out of an archive when it
; needs some other symbol from it; a handler is already (weakly) defined in
; the startup file, so it never triggers that on its own. A .c file that
; only holds a handler would then be dropped without any error. Linking the
; library objects directly rules that out.
lib_archive = no

build_flags =
    -D USE_STDPERIPH_DRIVER
    ; CMSIS and StdPeriph headers live in include/vendor/. They include each
    ; other by bare filename, so that folder goes on the include path.
    -I$PROJECT_DIR/include/vendor
    ; Uncomment to leave the EXTI handlers out of lib/joystick when an
    ; assignment needs its own EXTI0/1/4/9_5_IRQHandler:
    ; -D JOYSTICK_NO_IRQ_HANDLERS

platform_packages =
    toolchain-gccarmnoneeabi@~1.90301.0

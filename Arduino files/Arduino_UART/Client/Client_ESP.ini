  Serial.println(length);
  Serial.print("Client: Data: ");
  Serial.write(pData, length);
  Serial.println();
  std::string charUUID = pBLERemoteCharacteristic->getUUID().toString().c_str();

  String receivedText = String((char*)pData).substring(0, length);
  char buffer[64];
  receivedText.toCharArray(buffer, sizeof(buffer));
  // Separate values using commas
  char *token = strtok(buffer, ",");

  float number1 = atof(token);

  token = strtok(NULL, ",");
  float number2 = atof(token);

  token = strtok(NULL, ",");
  float number3 = atof(token);
if (charUUID == accelUUID.toString().c_str()) {
  float accX = number1;
  float accY = number2;
  float accZ = number3;
    Serial.print(" of data length ");
